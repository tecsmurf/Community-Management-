name: Test and build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  test-online:
    # The same tests against PostgreSQL, the shared online database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm
          POSTGRES_DB: cm_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cm:cm@localhost:5432/cm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --clean packaging\CommunityManager.spec
      - name: Smoke test the built app
        shell: pwsh
        run: |
          $env:COMMUNITY_DATA_DIR = "$env:RUNNER_TEMP\cm-data"
          $p = Start-Process dist\CommunityManager\CommunityManager.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:5055/ -UseBasicParsing
          Stop-Process -Id $p.Id
          if ($r.StatusCode -ne 200) { exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityManager-Setup
          path: dist/CommunityManager-Setup.exe

  android-app:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install briefcase==0.4.7
      - name: Build the Android app
        run: |
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android -p debug-apk --no-input
          mkdir -p apk && cp dist/*.apk "apk/CommunityManager-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityManager-Android
          path: apk/CommunityManager-Android.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash mobile/ci_smoke_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-screenshots
          path: mobile-screenshots/
