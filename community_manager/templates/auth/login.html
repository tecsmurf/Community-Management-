{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form method="post" class="card form narrow">
  <h1>Sign in</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <div class="form-actions"><button class="btn primary">Sign in</button></div>
  <p class="hint">Forgot your password? Ask the person who manages the app to set a new one for you.</p>
</form>
{% endblock %}
